<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/kanban.png" type="image/x-icon">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="countainer">
        <h1>Simple Kanban Board</h1>

        <div class="board">
            <div class="list" id="list1">
                <h2>To Do</h2>
                <div class="card" draggable="true" id="card1">Wash Dishes</div>
                <div class="card" draggable="true" id="card2">Buy Dishes</div>
            </div>

            <div class="list" id="list2">
                <h2>In Process</h2>
                <div class="card" draggable="true" id="card3">study</div>
            </div>

            <div class="list" id="list3">
                <h2>Done</h2>
              
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
